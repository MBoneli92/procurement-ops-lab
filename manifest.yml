applications:
  - name: procurement-api
    memory: 256M
    disk_quota: 512M
    instances: 1
    buildpacks:
      - python_buildpack
    command: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    routes:
      - route: procurement-api-matheus.cfapps.us10-001.hana.ondemand.com
    health-check-type: http
    health-check-http-endpoint: /health

    #Três linhas para entender. --port $PORT: o CF escolhe a porta e entrega numa variável de ambiente; o app que ignora isso nunca fica saudável. random-route: o domínio do trial é compartilhado com todo mundo, então um nome aleatório evita colisão. 
    #health-check-http-endpoint: o CF chama o /health periodicamente e reinicia a instância se não responder.